<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" role="img" aria-labelledby="t d">
  <title id="t">Baking Brownies at L1 with the flows between activities</title>
  <desc id="d">A1 Preheat Oven's output, the Preheated Oven, is a mechanism for A3. A2 Mix Ingredients' outputs, Brownie Batter and Greased Pan, are inputs to A3. A3 Bake &amp; Serve Brownies' output, Dirty Pans &amp; Utensils, is an input to A4 Cleanup. A3 also outputs Baked Brownies and A4 outputs Clean Pans &amp; Utensils.</desc>
  <defs>
    <marker id="aOl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3B4B35"/></marker>
    <marker id="aGo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A88A4F"/></marker>
    <marker id="aCl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C27B58"/></marker>
  </defs>
  <style>
    text { font-family: Inter, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #2C2E2F; }
    .lbl { font-size: 14px; }
    .sm { font-size: 12.5px; }
    .cat { font-size: 10.5px; font-weight: 700; letter-spacing: 1.4px; }
    .name { font-family: "Instrument Serif", Georgia, serif; font-size: 24px; }
    .nm { font-family: "Instrument Serif", Georgia, serif; font-size: 19px; }
    .id { font-size: 13px; font-weight: 700; fill: #3B4B35; }
    .wt { fill: #FFFFFF; }
  </style>
  <rect width="1100" height="540" fill="#FFFFFF"/>

  <rect x="60" y="50" width="180" height="80" rx="4" fill="#F0EAD6" stroke="#2C2E2F" stroke-width="2"/>
  <text class="nm" x="150.0" y="96" text-anchor="middle">Preheat Oven</text>
  <text class="id" x="230" y="120" text-anchor="end">A1</text>
  <rect x="290" y="160" width="180" height="80" rx="4" fill="#F0EAD6" stroke="#2C2E2F" stroke-width="2"/>
  <text class="nm" x="380.0" y="196" text-anchor="middle">Mix</text>
  <text class="nm" x="380.0" y="217" text-anchor="middle">Ingredients</text>
  <text class="id" x="460" y="230" text-anchor="end">A2</text>
  <rect x="520" y="270" width="180" height="80" rx="4" fill="#F0EAD6" stroke="#2C2E2F" stroke-width="2"/>
  <text class="nm" x="610.0" y="306" text-anchor="middle">Bake &amp; Serve</text>
  <text class="nm" x="610.0" y="327" text-anchor="middle">Brownies</text>
  <text class="id" x="690" y="340" text-anchor="end">A3</text>
  <rect x="760" y="380" width="180" height="80" rx="4" fill="#F0EAD6" stroke="#2C2E2F" stroke-width="2"/>
  <text class="nm" x="850.0" y="426" text-anchor="middle">Cleanup</text>
  <text class="id" x="930" y="450" text-anchor="end">A4</text>
  <path d="M470,200 H495 V310 H520" fill="none" stroke="#3B4B35" stroke-width="2" marker-end="url(#aOl)"/>
  <text class="sm" x="503" y="248">Brownie Batter, Greased Pan</text>
  <path d="M240,90 H262 V420 H610 V350" fill="none" stroke="#C27B58" stroke-width="2" marker-end="url(#aCl)"/>
  <text class="sm" x="430" y="440" text-anchor="middle">Preheated Oven (a mechanism for A3)</text>
  <path d="M700,330 H730 V420 H760" fill="none" stroke="#3B4B35" stroke-width="2" marker-end="url(#aOl)"/>
  <text class="sm" x="740" y="482" text-anchor="middle">Dirty Pans &amp; Utensils</text>
  <line x1="700" y1="290" x2="1075" y2="290" stroke="#3B4B35" stroke-width="2" marker-end="url(#aOl)"/>
  <text class="sm" x="1075" y="280" text-anchor="end">Baked Brownies</text>
  <line x1="940" y1="420" x2="1075" y2="420" stroke="#3B4B35" stroke-width="2" marker-end="url(#aOl)"/>
  <text class="sm" x="1075" y="410" text-anchor="end">Clean Pans &amp; Utensils</text>
  <text class="sm" x="20" y="524" font-style="italic">Each activity's other inputs, controls, and mechanisms are in its own diagram.</text>
</svg>
