<svg width="1200" height="560" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="mini-t mini-d"><title id="mini-t">The Requirements Fit Analyzer: seven phases in one loop</title><desc id="mini-d">Find, Judge, Validate, Decide, Build and Learn run in order; Publish follows Learn and feeds the next night&#x27;s Find. Dashed feedback arrows run back: blind grades from Decide to Validate, edits and statements from Learn to Build, and calls that retrain the models from Learn to Judge. A guardrail ring of deterministic gates surrounds every phase.</desc><style>.fm-ring{fill:none;stroke:#3b4b35;stroke-width:2}.fm-tick{stroke:#3b4b35;stroke-width:2}.fm-box{fill:#f0ead6;stroke:#7c7a71;stroke-width:1.5}.fm-ar{fill:none;stroke:#2c2e2f;stroke-width:2}.fm-ar--fb{stroke:#4a4b45;stroke-dasharray:7 6}.fm-num{fill:#bfa36f}text{font-family:'Iowan Old Style',Georgia,serif;fill:#2c2e2f}.fm-t-title{font-size:36px}.fm-t-num{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700;fill:#161914}.fm-t-ring{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;font-size:22px;font-weight:600;letter-spacing:.16em;fill:#3b4b35}</style><defs><marker id="mini-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c2e2f" /></marker><marker id="mini-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c27b58" /></marker><marker id="mini-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a4b45" /></marker></defs><rect class="fm-ring" x="8" y="8" width="1184" height="544" rx="36" /><line class="fm-tick" x1="120" y1="1" x2="120" y2="15" /><line class="fm-tick" x1="120" y1="545" x2="120" y2="559" /><line class="fm-tick" x1="300" y1="1" x2="300" y2="15" /><line class="fm-tick" x1="300" 