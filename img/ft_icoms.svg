<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="t d">
  <title id="t">IDEF0 context diagram with ICOMs</title>
  <desc id="d">Inputs enter from the left, Controls from the top, Outputs exit to the right, and Mechanisms enter from the bottom of the A0 box.</desc>
  <defs>
    <marker id="aOl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3B4B35"/></marker>
    <marker id="aGo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A88A4F"/></marker>
    <marker id="aCl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C27B58"/></marker>
  </defs>
  <style>
    text { font-family: Inter, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #2C2E2F; }
    .lbl { font-size: 14px; }
    .sm { font-size: 12.5px; }
    .cat { font-size: 10.5px; font-weight: 700; letter-spacing: 1.4px; }
    .name { font-family: "Instrument Serif", Georgia, serif; font-size: 24px; }
    .nm { font-family: "Instrument Serif", Georgia, serif; font-size: 19px; }
    .id { font-size: 13px; font-weight: 700; fill: #3B4B35; }
    .wt { fill: #FFFFFF; }
  </style>
  <rect width="760" height="420" fill="#FFFFFF"/>

  <defs><marker id="aGr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#CFC8B6"/></marker></defs>
  <line x1="30" y1="170" x2="270" y2="170" stroke="#3B4B35" stroke-width="2" marker-end="url(#aOl)"/>
  <line x1="30" y1="210" x2="270" y2="210" stroke="#3B4B35" stroke-width="2" marker-end="url(#aOl)"/>
  <line x1="30" y1="250" x2="270" y2="250" stroke="#3B4B35" stroke-width="2" marker-end="url(#aOl)"/>
  <rect x="82" y="198" width="116" height="26" rx="4" fill="#FFFFFF"/>
  <text x="140" y="216" text-anchor="middle" style="font-size:15px; font-weight:700; fill:#3B4B35"><tspan style="font-size:19px">I</tspan>nputs</text>
  <line x1="490" y1="170" x2="730" y2="170" stroke="#3B4B35" stroke-width="2" marker-end="url(#aOl)"/>
  <line x1="490" y1="210" x2="730" y2="210" stroke="#3B4B35" stroke-width="2" marker-end="url(#aOl)"/>
  <line x1="490" y1="250" x2="730" y2="250" stroke="#3B4B35" stroke-width="2" marker-end="url(#aOl)"/>
  <rect x="562" y="198" width="116" height="26" rx="4" fill="#FFFFFF"/>
  <text x="620" y="216" text-anchor="middle" style="font-size:15px; font-weight:700; fill:#3B4B35"><tspan style="font-size:19px">O</tspan>utputs</text>
  <line x1="310" y1="30" x2="310" y2="140" stroke="#A88A4F" stroke-width="2" marker-end="url(#aGo)"/>
  <line x1="380" y1="30" x2="380" y2="140" stroke="#A88A4F" stroke-width="2" marker-end="url(#aGo)"/>
  <line x1="450" y1="30" x2="450" y2="140" stroke="#A88A4F" stroke-width="2" marker-end="url(#aGo)"/>
  <rect x="322" y="63" width="116" height="26" rx="4" fill="#FFFFFF"/>
  <text x="380" y="81" text-anchor="middle" style="font-size:15px; font-weight:700; fill:#A88A4F"><tspan style="font-size:19px">C</tspan>ontrols</text>
  <line x1="310" y1="390" x2="310" y2="280" stroke="#C27B58" stroke-width="2" marker-end="url(#aCl)"/>
  <line x1="380" y1="390" x2="380" y2="280" stroke="#C27B58" stroke-width="2" marker-end="url(#aCl)"/>
  <line x1="450" y1="390" x2="450" y2="280" stroke="#C27B58" stroke-width="2" marker-end="url(#aCl)"/>
  <rect x="322" y="323" width="116" height="26" rx="4" fill="#FFFFFF"/>
  <text x="380" y="341" text-anchor="middle" style="font-size:15px; font-weight:700; fill:#C27B58"><tspan style="font-size:19px">M</tspan>echanisms</text>
  <rect x="270" y="140" width="220" height="140" rx="4" fill="#F0EAD6" stroke="#2C2E2F" stroke-width="2"/>
  <text class="name" x="380.0" y="218.0" text-anchor="middle">Process Name</text>
  <text class="id" x="478" y="268" text-anchor="end">A0</text>
</svg>
