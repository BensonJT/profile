<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 390" role="img" aria-labelledby="t d">
  <title id="t">Ax Activity: ICOM diagram</title>
  <desc id="d">Inputs: Input 1, Input 2. Controls: Control 1, Control 2. Outputs: Output 1, Output 2. Mechanisms: System, Tool, Personnel.</desc>
  <defs>
    <marker id="aOl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3B4B35"/></marker>
    <marker id="aGo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A88A4F"/></marker>
    <marker id="aCl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C27B58"/></marker>
  </defs>
  <style>
    text { font-family: Inter, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #2C2E2F; }
    .lbl { font-size: 14px; }
    .sm { font-size: 12.5px; }
    .cat { font-size: 10.5px; font-weight: 700; letter-spacing: 1.4px; }
    .name { font-family: "Instrument Serif", Georgia, serif; font-size: 24px; }
    .nm { font-family: "Instrument Serif", Georgia, serif; font-size: 19px; }
    .id { font-size: 13px; font-weight: 700; fill: #3B4B35; }
    .wt { fill: #FFFFFF; }
  </style>
  <rect width="768" height="390" fill="#FFFFFF"/>

  <text class="cat" x="230" y="22" style="fill:#A88A4F">CONTROLS</text>
  <line x1="333" y1="90" x2="333" y2="120" stroke="#A88A4F" stroke-width="2" marker-end="url(#aGo)"/>
  <text class="lbl" x="333" y="82" text-anchor="middle">Control 1</text>
  <line x1="435" y1="90" x2="435" y2="120" stroke="#A88A4F" stroke-width="2" marker-end="url(#aGo)"/>
  <text class="lbl" x="435" y="82" text-anchor="middle">Control 2</text>
  <rect x="230" y="120" width="308" height="130" rx="4" fill="#F0EAD6" stroke="#2C2E2F" stroke-width="2"/>
  <text class="name" x="384" y="193" text-anchor="middle">Activity</text>
  <text class="id" x="526" y="238" text-anchor="end">Ax</text>
  <text class="cat" x="20" y="112" style="fill:#3B4B35">INPUTS</text>
  <line x1="20" y1="163" x2="230" y2="163" stroke="#3B4B35" stroke-width="2" marker-end="url(#aOl)"/>
  <text class="lbl" x="125" y="155" text-anchor="middle">Input 1</text>
  <line x1="20" y1="207" x2="230" y2="207" stroke="#3B4B35" stroke-width="2" marker-end="url(#aOl)"/>
  <text class="lbl" x="125" y="199" text-anchor="middle">Input 2</text>
  <text class="cat" x="748" y="112" text-anchor="end" style="fill:#3B4B35">OUTPUTS</text>
  <line x1="538" y1="163" x2="748" y2="163" stroke="#3B4B35" stroke-width="2" marker-end="url(#aOl)"/>
  <text class="lbl" x="643" y="155" text-anchor="middle">Output 1</text>
  <line x1="538" y1="207" x2="748" y2="207" stroke="#3B4B35" stroke-width="2" marker-end="url(#aOl)"/>
  <text class="lbl" x="643" y="199" text-anchor="middle">Output 2</text>
  <line x1="307" y1="305" x2="307" y2="250" stroke="#C27B58" stroke-width="2" marker-end="url(#aCl)"/>
  <text class="lbl" x="307" y="325" text-anchor="middle">System</text>
  <line x1="384" y1="305" x2="384" y2="250" stroke="#C27B58" stroke-width="2" marker-end="url(#aCl)"/>
  <text class="lbl" x="384" y="325" text-anchor="middle">Tool</text>
  <line x1="461" y1="305" x2="461" y2="250" stroke="#C27B58" stroke-width="2" marker-end="url(#aCl)"/>
  <text class="lbl" x="461" y="325" text-anchor="middle">Personnel</text>
  <text class="cat" x="230" y="376" style="fill:#C27B58">MECHANISMS</text>
</svg>
