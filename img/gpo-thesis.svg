  <text x="386" y="337" class="domain-line">Lead-to-Order</text>
  <text x="386" y="357" class="domain-tag">Revenue origination — secure contracts</text>

  <rect x="366" y="381" width="272" height="56" fill="#FFFFFF" stroke="#3B4B35" stroke-width="1.5"/>
  <rect x="366" y="381" width="8" height="56" fill="#C27B58"/>
  <text x="386" y="403" class="domain-line">Order-to-Operate</text>
  <text x="386" y="423" class="domain-tag">Service delivery — operations &amp; relationship</text>

