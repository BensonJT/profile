  <!-- D90 -->
  <g transform="translate(972, 318)">
    <rect x="0" y="0" width="60" height="22" rx="4" fill="#C27B58"/>
    <text x="30" y="15" text-anchor="middle" style="font-size:11px;font-weight:700;fill:#FFFFFF;letter-spacing:1px;font-family:'Inter',sans-serif;">DAY 90</text>
    <text x="72" y="16" class="item-bold">Early wins</text>
    <text x="0" y="42" class="item-text">L2O → O2O handoff drafted;</text>
    <text x="0" y="58" class="item-text">P2B site selection framework;</text>
    <text x="0" y="74" class="item-text">branch immersion at 5+ locations.</text>
