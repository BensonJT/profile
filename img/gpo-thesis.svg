  <rect x="954" y="654" width="288" height="46" fill="#F0EAD6"/>
  <text x="1098" y="675" text-anchor="middle" style="font-size:11px;font-weight:700;fill:#3B4B35;letter-spacing:1.5px;font-family:'Inter',sans-serif;">THE CADENCE</text>
  <text x="1098" y="692" text-anchor="middle" style="font-size:12px;fill:#2C2E2F;font-style:italic;font-family:'Inter',sans-serif;">Listen. Build. Prove. Scale.</text>

  <!-- Arrow 4→5 -->
  <line x1="1244" y1="430" x2="1250" y2="430" stroke="#3B4B35" stroke-width="2.5" marker-end="url(#thesis-arrow)"/>

