  <text x="800" y="623" text-anchor="middle" class="item-sub">Director + 5 Senior / Principal ICs</text>

  <rect x="656" y="654" width="288" height="46" fill="#F0EAD6"/>
  <text x="800" y="675" text-anchor="middle" style="font-size:11px;font-weight:700;fill:#3B4B35;letter-spacing:1.5px;font-family:'Inter',sans-serif;">THE TEAM</text>
  <text x="800" y="692" text-anchor="middle" style="font-size:12px;fill:#2C2E2F;font-style:italic;font-family:'Inter',sans-serif;">Senior by design — not analyst-staffed.</text>

  <!-- Arrow 3→4 -->
  <line x1="946" y1="430" x2="952" y2="430" stroke="#3B4B35" stroke-width="2.5" marker-end="url(#thesis-arrow)"/>

