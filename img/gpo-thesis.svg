  <rect width="1600" height="880" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="60" y="28" class="ctx">The thesis on one page — the verbal anchor for the first five minutes of any conversation.</text>
  <text x="60" y="62" class="title">The Thesis: One Function, One Equation</text>
  <text x="60" y="88" class="subtitle">3 inflection points · 5 GPO domains · 1 Director + 5 ICs · 90/180/365 milestones · 5× ROI floor.</text>

  <!-- ===== STATION CAPTION BAR ===== -->
  <rect x="60" y="118" width="1480" height="32" fill="#2C2E2F"/>

  <!-- 5 stations, w=288, gap=10 → x: 60, 358, 656, 954, 1252 -->
  <text x="204"  y="139" text-anchor="middle" class="station-cap">WHY NOW</text>
  <text x="502"  y="139" text-anchor="middle" class="station-cap">WHAT</text>
  <text x="800"  y="139" text-anchor="middle" class="station-cap">WHO</text>
  <text x="1098" y="139" text-anchor="middle" class="station-cap">WHEN</text>
  <text x="1396" y="139" text-anchor="middle" class="station-cap">HOW MUCH</text>

  <!-- ===== STATION 1: WHY NOW — 3 inflection points ===== -->
  <rect x="60" y="160" width="288" height="540" fill="#FFFFFF" stroke="#3B4B35" stroke-width="1.5"/>
  <text x="204" y="188" text-anchor="middle" class="station-head">Three Inflection Points</text>
  <text x="204" y="208" text-anchor="middle" class="station-sub">All real. All operating simultaneously.</text>

  <g transform="translate(78, 232)">
    <text x="0" y="22" class="item-num">1</text>
    <text x="32" y="22" class="item-bold">Scale Without Chaos</text>
    <text x="32" y="42" class="item-text">Adding new branches</text>
    <text x="32" y="58" class="item-text">faster than the operating</text>
    <text x="32" y="74" class="item-text">model can standardize.</text>
    <text x="32" y="96" class="item-sub">The operationally urgent driver.</text>
  </g>

  <g transform="translate(78, 358)">
    <text x="0" y="22" class="item-num">2</text>
    <text x="32" y="22" class="item-bold">Private Equity EBITDA</text>
    <text x="32" y="42" class="item-bold">Discipline</text>
    <text x="32" y="62" class="item-text">Operational controls must be</text>
    <text x="32" y="78" class="item-text">visible, measurable, and</text>
    <text x="32" y="94" class="item-text">improving.</text>
    <text x="32" y="116" class="item-sub">The governance frame around it.</text>
  </g>

  <g transform="translate(78, 504)">
    <text x="0" y="22" class="item-num">3</text>
    <text x="32" y="22" class="item-bold">Operating Model Drift</text>
    <text x="32" y="42" class="item-text">Growth has produced regional</text>
    <text x="32" y="58" class="item-text">and site-by-site variation in</text>
    <text x="32" y="74" class="item-text">how work gets done. Standards</text>
    <text x="32" y="90" class="item-text">unlock synergy and controls.</text>
    <text x="32" y="112" class="item-sub">Fragmentation has a measurable cost.</text>
  </g>

  <rect x="60" y="654" width="288" height="46" fill="#F0EAD6"/>
  <text x="204" y="675" text-anchor="middle" style="font-size:11px;font-weight:700;fill:#3B4B35;letter-spacing:1.5px;font-family:'Inter',sans-serif;">THE THESIS</text>
  <text x="204" y="692" text-anchor="middle" style="font-size:12px;fill:#2C2E2F;font-style:italic;font-family:'Inter',sans-serif;">Build the function that fits all three.</text>

  <!-- Arrow 1→2 -->
  <line x1="350" y1="430" x2="356" y2="430" stroke="#3B4B35" stroke-width="2.5" marker-end="url(#thesis-arrow)"/>

