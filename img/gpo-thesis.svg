  <!-- D365 -->
  <g transform="translate(972, 526)">
    <rect x="0" y="0" width="60" height="22" rx="4" fill="#3B4B35"/>
    <text x="30" y="15" text-anchor="middle" style="font-size:11px;font-weight:700;fill:#FFFFFF;letter-spacing:1px;font-family:'Inter',sans-serif;">DAY 365</text>
    <text x="72" y="16" class="item-bold">GPO operating</text>
    <text x="0" y="42" class="item-text">Playbook v1.0 + 5-domain KPI suite;</text>
