  <text x="386" y="568" class="domain-tag">Workforce lifecycle — all domains</text>

  <!-- Change Capability tier -->
  <text x="366" y="600" style="font-size:10px;font-weight:700;fill:#7A6A56;letter-spacing:1.5px;font-family:'Inter',sans-serif;">CHANGE CAPABILITY</text>

  <rect x="366" y="608" width="272" height="40" fill="#F0EAD6" stroke="#D4C6A8" stroke-width="1"/>
  <rect x="366" y="608" width="8" height="40" fill="#C27B58"/>
  <text x="386" y="626" class="domain-line">Change Management</text>
  <text x="386" y="641" class="domain-tag">Adoption layer across all 5 domains</text>

  <rect x="358" y="654" width="288" height="46" fill="#F0EAD6"/>
  <text x="502" y="675" text-anchor="middle" style="font-size:11px;font-weight:700;fill:#3B4B35;letter-spacing:1.5px;font-family:'Inter',sans-serif;">THE SCOPE</text>
  <text x="502" y="692" text-anchor="middle" style="font-size:12px;fill:#2C2E2F;font-style:italic;font-family:'Inter',sans-serif;">Four seams. One owns them all.</text>

  <!-- Arrow 2→3 -->
  <line x1="648" y1="430" x2="654" y2="430" stroke="#3B4B35" stroke-width="2.5" marker-end="url(#thesis-arrow)"/>

