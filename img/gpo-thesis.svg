  <rect x="60" y="730" width="8" height="92" fill="#C27B58"/>
  <text x="800" y="768" text-anchor="middle" style="font-size:22px;font-weight:700;fill:#FFFFFF;font-style:italic;font-family:'Inter',sans-serif;">Three inflection points. Five domains. Four seams.</text>
  <text x="800" y="800" text-anchor="middle" style="font-size:18px;fill:#F0EAD6;font-style:italic;font-family:'Inter',sans-serif;">One function built to produce measurable EBITDA — not narrative.</text>

  <!-- Bottom line -->
