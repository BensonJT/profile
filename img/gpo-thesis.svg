    <rect x="6" y="34" width="40" height="24" rx="6" fill="#3B4B35"/>
    <text x="26" y="51" text-anchor="middle" style="font-size:14px;font-weight:700;fill:#FFFFFF;font-family:'Inter',sans-serif;">5×</text>
