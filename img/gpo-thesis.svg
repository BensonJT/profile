  <!-- Return -->
  <text x="1396" y="408" text-anchor="middle" style="font-size:10px;font-weight:700;fill:#7A6A56;letter-spacing:1.5px;font-family:'Inter',sans-serif;">YEAR 1 MINIMUM</text>
  <text x="1396" y="444" text-anchor="middle" class="big-amber">~$7.75M+</text>
  <text x="1396" y="464" text-anchor="middle" class="item-sub">Measurable, attributable EBITDA</text>
  <text x="1396" y="482" text-anchor="middle" class="item-sub">Range: $5M–$16M+ (3+ value sources)</text>

