  <rect x="358" y="160" width="288" height="540" fill="#FFFFFF" stroke="#3B4B35" stroke-width="1.5"/>
  <text x="502" y="188" text-anchor="middle" class="station-head">Five Domains + Change Capability</text>
  <text x="502" y="208" text-anchor="middle" class="station-sub">Value streams, enablers, and change capability.</text>

  <!-- Primary streams -->
