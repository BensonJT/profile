  <text x="1396" y="208" text-anchor="middle" class="station-sub">Math that survives Private Equity scrutiny.</text>

  <!-- Investment -->
  <text x="1396" y="248" text-anchor="middle" style="font-size:10px;font-weight:700;fill:#7A6A56;letter-spacing:1.5px;font-family:'Inter',sans-serif;">INVESTMENT</text>
  <text x="1396" y="284" text-anchor="middle" class="big-money">~$1.55M</text>
  <text x="1396" y="304" text-anchor="middle" class="item-sub">Scenario A team cost</text>

  <!-- Multiplier -->
  <g transform="translate(1370, 322)">
    <line x1="26" y1="0" x2="26" y2="22" stroke="#3B4B35" stroke-width="2"/>
