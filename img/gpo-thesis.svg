  <!-- D180 -->
  <g transform="translate(972, 422)">
    <rect x="0" y="0" width="60" height="22" rx="4" fill="#C27B58"/>
    <text x="30" y="15" text-anchor="middle" style="font-size:11px;font-weight:700;fill:#FFFFFF;letter-spacing:1px;font-family:'Inter',sans-serif;">DAY 180</text>
    <text x="72" y="16" class="item-bold">First EBITDA story</text>
