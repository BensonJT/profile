  <rect x="674" y="232" width="252" height="58" fill="#3B4B35"/>
  <text x="800" y="258" text-anchor="middle" style="font-size:16px;font-weight:700;fill:#FFFFFF;font-family:'Inter',sans-serif;">Director, Process</text>
  <text x="800" y="278" text-anchor="middle" style="font-size:16px;font-weight:700;fill:#FFFFFF;font-family:'Inter',sans-serif;">Excellence</text>

  <!-- IC stack -->
  <text x="674" y="316" style="font-size:10px;font-weight:700;fill:#7A6A56;letter-spacing:1.5px;font-family:'Inter',sans-serif;">5 SENIOR / PRINCIPAL ICs</text>

  <rect x="674" y="326" width="252" height="36" fill="#FFFFFF" stroke="#3B4B35" stroke-width="1.5"/>
  <text x="688" y="349" class="item-text">• GPO Lead 1 — P2B (dedicated)</text>

  <rect x="674" y="368" width="252" height="36" fill="#FFFFFF" stroke="#3B4B35" stroke-width="1.5"/>
  <text x="688" y="391" class="item-text">• GPO Lead 2 — L2O + O2O</text>

  <rect x="674" y="410" width="252" height="36" fill="#FFFFFF" stroke="#3B4B35" stroke-width="1.5"/>
  <text x="688" y="433" class="item-text">• GPO Lead 3 — S2P + H2R</text>

  <rect x="674" y="452" width="252" height="36" fill="#FFFFFF" stroke="#3B4B35" stroke-width="1.5"/>
