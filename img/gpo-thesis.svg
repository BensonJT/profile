    .item-bold    { font-size: 13px; fill: #2C2E2F; font-weight: 700; }
    .item-sub     { font-size: 11px; fill: #7A6A56; font-style: italic; }
    .domain-line  { font-size: 14px; font-weight: 700; fill: #3B4B35; }
