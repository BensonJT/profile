<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 908 460" role="img" aria-labelledby="t d">
  <title id="t">A2 Mix Ingredients: ICOM diagram</title>
  <desc id="d">Inputs: Brownie Mix, Eggs, Water, Grease. Controls: Recipe, Customer Preferences. Outputs: Brownie Batter, Trash, Greased Pan. Mechanisms: Mixing Bowl &amp; Spoon, Pan, Baker.</desc>
  <defs>
    <marker id="aOl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3B4B35"/></marker>
