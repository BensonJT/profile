  <text class="lbl" x="436.0" y="468" text-anchor="end">Grocery Store Clerk</text>
  <text class="lbl" x="436.0" y="485" text-anchor="end">Fuel Provider</text>
  <text class="lbl" x="436.0" y="502" text-anchor="end">Oven</text>
  <text class="lbl" x="436.0" y="519" text-anchor="end">Timer</text>
  <text class="lbl" x="464.0" y="434" text-anchor="start">Mixing Bowl &amp; Spoon</text>
  <text class="lbl" x="464.0" y="451" text-anchor="start">Pan</text>
  <text class="lbl" x="464.0" y="468" text-anchor="start">Spatula</text>
  <text class="lbl" x="464.0" y="485" text-anchor="start">Oven Mitt</text>
  <text class="lbl" x="464.0" y="502" text-anchor="start">Cooling Rack</text>
  <text class="lbl" x="464.0" y="519" text-anchor="start">Sink &amp; Towels</text>
</svg>
