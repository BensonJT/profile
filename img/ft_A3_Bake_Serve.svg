<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1056 420" role="img" aria-labelledby="t d">
  <title id="t">A3 Bake &amp; Serve Brownies: ICOM diagram</title>
  <desc id="d">Inputs: Brownie Batter, Greased Pan. Controls: Recipe, Customer Preferences, Oven Performance. Outputs: Baked Brownies, Defective Brownies, Dirty Pans &amp; Utensils. Mechanisms: Preheated Oven, Timer, Oven Mitt, Cooling Rack, Baker, Oven Operator.</desc>
