<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid meet">

  <style>
    text { font-family: 'Inter', 'Segoe UI', -apple-system, Roboto, Arial, sans-serif; }
    .ctx        { font-size: 13px; fill: #7A6A56; font-style: italic; }
    .title      { font-size: 26px; font-weight: 700; fill: #2C2E2F; }
    .tier-cap   { font-size: 11px; font-weight: 700; fill: #7A6A56; letter-spacing: 2px; }
    .big-num    { font-size: 42px; font-weight: 700; fill: #2C2E2F; }
    .big-amber  { font-size: 42px; font-weight: 700; fill: #C27B58; }
    .big-navy   { font-size: 34px; font-weight: 700; fill: #3B4B35; }
    .eq-label   { font-size: 12px; fill: #5A5043; font-style: italic; }
    .eq-sub     { font-size: 11px; fill: #7A6A56; font-style: italic; }
    .eq-punch   { font-size: 12px; font-weight: 700; fill: #3B4B35; }
    .domain-name { font-size: 20px; font-weight: 700; fill: #FFFFFF; }
    .card-sub   { font-size: 12px; font-style: italic; fill: #F0EAD6; }
    .badge-text { font-size: 11px; font-weight: 700; fill: #FFFFFF; letter-spacing: 0.5px; }
    .card-head  { font-size: 12px; font-weight: 700; fill: #3B4B35; }
    .card-item  { font-size: 12px; fill: #2C2E2F; }
    .card-anchor { font-size: 11px; fill: #7A6A56; font-style: italic; }
    .gate-cap   { font-size: 11px; font-weight: 700; fill: #FFFFFF; letter-spacing: 1.5px; }
    .gate-head  { font-size: 21px; font-weight: 700; fill: #FFFFFF; }
    .gate-action { font-size: 13px; font-weight: 700; fill: #FFFFFF; }
    .gate-desc  { font-size: 12px; fill: #FFFFFF; font-style: italic; }
    .footer     { font-size: 13px; fill: #7A6A56; font-style: italic; }
  </style>

  <rect width="1600" height="800" fill="#FFFFFF"/>

  <!-- Context + Title -->
  <text x="60" y="26" class="ctx">Co-designed with functional leaders. Standards governed by GPO.</text>
  <text x="60" y="57" class="title">Process Excellence: Investment Case and ROI Threshold</text>
  <text x="60" y="75" class="ctx">Minimum Year 1 return: 5× team cost in measurable, attributable EBITDA — the math must hold up to Private Equity reporting standards.</text>

  <!-- ===== FINANCIAL EQUATION STRIP ===== -->
  <rect x="60" y="88" width="1480" height="124" fill="#F0EAD6" stroke="#D4C6A8" stroke-width="1"/>
  <rect x="60" y="88" width="8"    height="124" fill="#3B4B35"/>

  <!-- Block A: The Investment (x=80–470) -->
  <text x="88" y="108" class="tier-cap">THE INVESTMENT</text>
  <text x="88" y="151" class="big-num">~$1.55M</text>
  <text x="88" y="171" class="eq-label">Scenario A — estimated fully loaded Year 1 team cost</text>
  <text x="88" y="188" class="eq-sub">Director + 5 Senior/Principal ICs</text>

  <!-- 5× connector badge -->
  <line x1="475" y1="150" x2="545" y2="150" stroke="#3B4B35" stroke-width="2"/>
  <polygon points="545,144 556,150 545,156" fill="#3B4B35"/>
  <rect x="487" y="134" width="46" height="26" rx="6" fill="#3B4B35"/>
  <text x="510" y="151" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#FFFFFF;font-family:'Inter',sans-serif;">5×</text>

  <!-- Block B: The Return (x=570–1090) -->
  <text x="570" y="108" class="tier-cap">THE RETURN — YEAR 1 MINIMUM</text>
  <text x="570" y="151" class="big-amber">~$7.75M+</text>
  <text x="570" y="171" class="eq-label">Measurable, attributable EBITDA — 5× floor on ~$1.55M investment</text>
  <text x="570" y="188" class="eq-sub">Conservative range: $5M–$16M+ across 3+ value sources</text>

  <!-- Separator -->
  <line x1="1095" y1="100" x2="1095" y2="200" stroke="#D4C6A8" stroke-width="1"/>

  <!-- Block C: Baseline Discipline (x=1112–1530) -->
  <text x="1112" y="108" class="tier-cap">BASELINE DISCIPLINE</text>
  <text x="1112" y="132" class="eq-label">No improvement is claimed without a defensible</text>
  <text x="1112" y="149" class="eq-label">Day 30 baseline. The improvement story is the</text>
  <text x="1112" y="166" class="eq-label">delta from that baseline — not an assumed prior state.</text>
  <text x="1112" y="187" class="eq-sub">Data Engineer's first deliverable = measurement infrastructure.</text>
  <text x="1112" y="203" class="eq-punch">Every dollar attributed must survive Private Equity scrutiny.</text>

  <!-- ===== THREE VALUE SOURCE CARDS ===== -->
  <!-- Card 1: Plan-to-Build (x=60, w=487) -->
  <rect x="60"  y="224" width="487" height="298" fill="#FFFFFF" stroke="#3B4B35" stroke-width="1.5"/>
  <rect x="60"  y="224" width="487" height="56"  fill="#3B4B35"/>
  <text x="304" y="255" text-anchor="middle" class="domain-name">Plan-to-Build</text>
  <text x="304" y="272" text-anchor="middle" class="card-sub">Owner's process governance</text>
  <rect x="463" y="228" width="72" height="20" rx="4" fill="#C27B58"/>
  <text x="499" y="241" text-anchor="middle" class="badge-text">~$2M – $5M</text>

  <text x="78"  y="302" class="card-head">Value source:</text>
  <text x="78"  y="320" class="card-item">Site selection governance, change order control,</text>
  <text x="78"  y="338" class="card-item">and program management standards governing</text>
  <text x="78"  y="356" class="card-item">multimillion-dollar branch expansions.</text>
  <text x="78"  y="381" class="card-head">Mechanism:</text>
  <text x="78"  y="399" class="card-item">• Site selection framework — D90 deliverable</text>
  <text x="78"  y="417" class="card-item">• Change order governance standards</text>
  <text x="78"  y="435" class="card-item">• Owner's program management process</text>
  <text x="78"  y="460" class="card-anchor">Anchor: launch delay &amp; leakage. If framework prevents</text>
  <text x="78"  y="476" class="card-anchor">one delayed branch launch, team cost is recovered</text>
  <text x="78"  y="492" class="card-anchor">many times over. Baseline measured Day 30.</text>

  <!-- Card 2: Source-to-Pay (x=557, w=487) -->
  <rect x="557" y="224" width="487" height="298" fill="#FFFFFF" stroke="#3B4B35" stroke-width="1.5"/>
  <rect x="557" y="224" width="487" height="56"  fill="#3B4B35"/>
  <text x="800" y="255" text-anchor="middle" class="domain-name">Source-to-Pay</text>
  <text x="800" y="272" text-anchor="middle" class="card-sub">Procurement standardization</text>
  <rect x="960" y="228" width="72" height="20" rx="4" fill="#C27B58"/>
  <text x="996" y="241" text-anchor="middle" class="badge-text">~$2M – $8M</text>

  <text x="575" y="302" class="card-head">Value source:</text>
  <text x="575" y="320" class="card-item">Consistent supplier qualification, contracting</text>
  <text x="575" y="338" class="card-item">standards, and maverick spend reduction across</text>
  <text x="575" y="356" class="card-item">the company's multimillion-dollar spend base.</text>
  <text x="575" y="381" class="card-head">Mechanism:</text>
  <text x="575" y="399" class="card-item">• Supplier qualification standards</text>
  <text x="575" y="417" class="card-item">• Contract term leverage through consistency</text>
  <text x="575" y="435" class="card-item">• Maverick spend identification &amp; reduction</text>
  <text x="575" y="460" class="card-anchor">Anchor: PE platform benchmarks capture 3–7% of</text>
  <text x="575" y="476" class="card-anchor">addressable spend in Year 1. Scoped with the</text>
  <text x="575" y="492" class="card-anchor">procurement organization to a specific category.</text>

  <!-- Card 3: Order-to-Operate (x=1054, w=487) -->
  <rect x="1054" y="224" width="487" height="298" fill="#FFFFFF" stroke="#3B4B35" stroke-width="1.5"/>
  <rect x="1054" y="224" width="487" height="56"  fill="#3B4B35"/>
  <text x="1297" y="255" text-anchor="middle" class="domain-name">Order-to-Operate</text>
  <text x="1297" y="272" text-anchor="middle" class="card-sub">Provisioning velocity</text>
  <rect x="1457" y="228" width="72" height="20" rx="4" fill="#C27B58"/>
  <text x="1493" y="241" text-anchor="middle" class="badge-text">~$1M – $3M</text>

  <text x="1072" y="302" class="card-head">Value source:</text>
  <text x="1072" y="320" class="card-item">10% compression in provisioning cycle time</text>
  <text x="1072" y="338" class="card-item">from signed contract to service delivery —</text>
  <text x="1072" y="356" class="card-item">compounding value across the customer base.</text>
  <text x="1072" y="381" class="card-head">Mechanism:</text>
  <text x="1072" y="399" class="card-item">• L2O → O2O handoff standard (D90 deliverable)</text>
  <text x="1072" y="417" class="card-item">• Provisioning SLA baseline + variance reduction</text>
  <text x="1072" y="435" class="card-item">• Onboarding process standards at scale</text>
  <text x="1072" y="460" class="card-anchor">Anchor: Every day faster = revenue acceleration</text>
  <text x="1072" y="476" class="card-anchor">and working capital efficiency. Measured at</text>
  <text x="1072" y="492" class="card-anchor">the CRITICAL seam — highest-risk in the architecture.</text>

  <!-- ===== YEAR 2 INVESTMENT GATE ===== -->
  <rect x="60" y="534" width="1480" height="24" fill="#2C2E2F"/>
  <text x="800" y="550" text-anchor="middle"
        style="font-size:11px;font-weight:700;fill:#FFFFFF;letter-spacing:2px;font-family:'Inter',sans-serif;">THE YEAR 2 INVESTMENT GATE — OUTCOME-GOVERNED DECISION</text>

  <!-- Gate Col 1: &lt; 3× (slate) -->
  <rect x="60"  y="558" width="490" height="132" fill="#5A5043"/>
  <text x="305" y="579" text-anchor="middle" class="gate-cap">&lt; 3× ROI</text>
  <text x="305" y="607" text-anchor="middle" class="gate-head">Diagnose the Gap</text>
  <text x="305" y="631" text-anchor="middle" class="gate-action">Identify causes. Adjust the approach.</text>
  <text x="305" y="652" text-anchor="middle" class="gate-desc">A shortfall is a data problem, not a verdict.</text>
  <text x="305" y="669" text-anchor="middle" class="gate-desc">Root cause drives the revised investment case.</text>

  <!-- Gate Col 2: 3×–5× (navy) -->
  <rect x="560" y="558" width="490" height="132" fill="#3B4B35"/>
  <text x="805" y="579" text-anchor="middle" class="gate-cap">3× – 5× ROI</text>
  <text x="805" y="607" text-anchor="middle" class="gate-head">Maintain Scenario A</text>
  <text x="805" y="631" text-anchor="middle" class="gate-action">Targeted additions where value is proven</text>
  <text x="805" y="652" text-anchor="middle" class="gate-desc">Team stays at current complement.</text>
  <text x="805" y="669" text-anchor="middle" class="gate-desc">Concentrated wins drive the next focused investment.</text>

  <!-- Gate Col 3: &gt; 5× (amber) -->
  <rect x="1060" y="558" width="480" height="132" fill="#C27B58"/>
  <text x="1300" y="579" text-anchor="middle" class="gate-cap">&gt; 5× ROI — MULTI-DOMAIN WINS</text>
  <text x="1300" y="607" text-anchor="middle" class="gate-head">Scenario B Build-Out</text>
  <text x="1300" y="631" text-anchor="middle" class="gate-action">Add 4 specialists → ~$2.55M team</text>
  <text x="1300" y="652" text-anchor="middle" class="gate-desc">+2 GPO Leads, AI Workflow Architect,</text>
  <text x="1300" y="669" text-anchor="middle" class="gate-desc">Process Mining specialist (Celonis or equivalent).</text>

  <!-- Domain Legend -->
  <text x="800" y="742" text-anchor="middle" class="footer">Hire-to-Retire (H2R)  ·  Plan-to-Build (P2B)  ·  Lead-to-Order (L2O)  ·  Order-to-Operate (O2O)  ·  Source-to-Pay (S2P)</text>

</svg>
