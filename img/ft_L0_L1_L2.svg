<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1562 360" role="img" aria-labelledby="t d">
  <title id="t">Activity Node Tree for Baking Brownies, L0 to L2</title>
  <desc id="d">L1 activities A1 to A4 and their L2 activities: A1.1 Secure Fuel, A1.2 Check Oven, A1.3 Ignite Oven, A2.1 Secure Ingredients, A2.2 Combine Ingredients, A2.3 Mix Ingredients, A2.4 Pour Ingredients, A3.1 Bake Brownies, A3.2 Cool Brownies, A3.3 Serve Brownies. A4 Cleanup stays at L1.</desc>
  <defs>
    <marker id="aOl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3B4B35"/></marker>
    <marker id="aGo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A88A4F"/></marker>
    <marker id="aCl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C27B58"/></marker>
  </defs>
