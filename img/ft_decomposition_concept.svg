  <rect x="748" y="25" width="112" height="58" rx="5" fill="#3B4B35"/>
  <text class="sm wt" x="804" y="50" text-anchor="middle" style="fill:#FFFFFF">Process Name</text>
  <text class="sm" x="804" y="77" text-anchor="middle" style="fill:#F0EAD6; font-size:11px">(A0)</text>
