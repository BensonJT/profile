<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" preserveAspectRatio="xMidYMid meet">

  <style>
    text { font-family: 'Avenir Next', 'Helvetica Neue', Arial, sans-serif; }
    .ctx        { font-size: 14px; fill: #6B6A63; font-style: italic; }
    .title      { font-size: 30px; font-weight: 700; fill: #2C2E2F; }
    .subtitle   { font-size: 15px; fill: #3B4B35; font-style: italic; }
    .eyebrow    { font-size: 12px; font-weight: 700; fill: #C27B58; letter-spacing: 2.5px; }
    .sec        { font-size: 11px; font-weight: 700; fill: #3B4B35; letter-spacing: 1.8px; }
    .micro      { font-size: 9.5px; font-weight: 700; fill: #BFA36F; letter-spacing: 1.5px; }
    .name       { font-size: 23px; font-weight: 700; fill: #2C2E2F; }
    .tagline    { font-size: 15px; fill: #C27B58; font-style: italic; }
    .bullet     { font-size: 13.5px; fill: #2C2E2F; }
    .bullet-c   { font-size: 13.5px; fill: #6B6A63; }
    .found      { font-size: 14px; fill: #2C2E2F; }
    .found-num  { font-size: 14px; font-weight: 700; fill: #BFA36F; }
    .stat-v     { font-size: 13.5px; font-weight: 700; fill: #C27B58; }
