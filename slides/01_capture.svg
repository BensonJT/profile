<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" preserveAspectRatio="xMidYMid meet">

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3B4B35"/>
    </marker>
    <marker id="arrclay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C27B58"/>
    </marker>
  </defs>

  <style>
    text { font-family: 'Avenir Next', 'Helvetica Neue', Arial, sans-serif; }
    .ctx        { font-size: 14px; fill: #6B6A63; font-style: italic; }
    .title      { font-size: 30px; font-weight: 700; fill: #2C2E2F; }
    .subtitle   { font-size: 15px; fill: #3B4B35; font-style: italic; }
    .band-cap   { font-size: 13px; font-weight: 700; fill: #FFFFFF; letter-spacing: 2px; }
    .band-cap-g { font-size: 13px; font-weight: 700; fill: #7DC97D; letter-spacing: 2px; }
    .feat-n     { font-size: 15px; font-weight: 700; fill: #FFFFFF; }
    .feat-t     { font-size: 16px; font-weight: 700; fill: #2C2E2F; }
    .feat-d     { font-size: 13.5px; fill: #4A4A45; }
    .sch-cap    { font-size: 10px; font-weight: 700; fill: #6B6A63; letter-spacing: 1.5px; }
    .node       { font-size: 13px; font-weight: 700; fill: #FFFFFF; }
    .sipoc-l    { font-size: 12px; font-weight: 700; fill: #FFFFFF; }
    .sipoc-w    { font-size: 10.5px; fill: #4A4A45; }
    .icom-l     { font-size: 11px; font-weight: 700; fill: #3B4B35; }
    .micro      { font-size: 9.5px; font-weight: 700; fill: #BFA36F; letter-spacing: 1.5px; }
    .pc-skill   { font-size: 15px; font-weight: 700; fill: #2C2E2F; }
    .pc-v       { font-size: 20px; font-weight: 700; fill: #C27B58; }
    .pc-l       { font-size: 12.5px; fill: #4A4A45; }
    .pc-anchor  { font-size: 12px; fill: #6B6A63; font-style: italic; }
    .footer     { font-size: 14px; fill: #6B6A63; font-style: italic; }
  </style>

  <rect width="1600" height="920" fill="#F0EAD6"/>

  <!-- Header -->
  <text x="60" y="34" class="ctx">Project Forester  ·  Layer 1 of 5  ·  the structured-capture foundation</text>
  <text x="60" y="72" class="title">Capture: Structure &amp; the AI Interview</text>
  <text x="60" y="96" class="subtitle">Turn “what happens here” into a rigorous, accountable model — captured live, in conversation, by an AI trained on the method.</text>
  <line x1="60" y1="112" x2="1540" y2="112" stroke="#D9CFB8" stroke-width="1.5"/>

  <!-- ═══════════ UPPER BAND — IN THE PRODUCT ═══════════ -->
  <rect x="60" y="128" width="1480" height="40" fill="#3B4B35"/>
  <text x="80" y="153"><tspan class="band-cap-g">IN THE PRODUCT</tspan><tspan class="band-cap">   —  STRUCTURED CAPTURE &amp; THE AI INTERVIEW</tspan></text>
  <rect x="60" y="168" width="1480" height="368" fill="#FFFFFF" stroke="#D9CFB8" stroke-width="1"/>

  <!-- Left: four capabilities -->
  <!-- F1 -->
  <circle cx="96" cy="204" r="15" fill="#3B4B35"/>
  <text x="96" y="209" text-anchor="middle" class="feat-n">1</text>
  <text x="128" y="200" class="feat-t">Functional decomposition (IDEF0)</text>
  <text x="128" y="222" class="feat-d">Break any process into a 3–6-activity tree, auto-numbered</text>
  <text x="128" y="240" class="feat-d">A0 → A1 → A1.2. Rigor, without the busywork.</text>

  <!-- F2 -->
  <circle cx="96" cy="288" r="15" fill="#3B4B35"/>
  <text x="96" y="293" text-anchor="middle" class="feat-n">2</text>
  <text x="128" y="284" class="feat-t">SIPOC accountability</text>
  <text x="128" y="306" class="feat-d">Every activity names a Supplier, Input, Process, Output,</text>
  <text x="128" y="324" class="feat-d">Customer — people are named, so nothing slips a seam.</text>

  <!-- F3 -->
  <circle cx="96" cy="372" r="15" fill="#3B4B35"/>
  <text x="96" y="377" text-anchor="middle" class="feat-n">3</text>
  <text x="128" y="368" class="feat-t">ICOM flow analysis</text>
  <text x="128" y="390" class="feat-d">Inputs, Controls, Outputs, Mechanisms as explicit arrows.</text>
  <text x="128" y="408" class="feat-d">Controls govern; Inputs get consumed — the line most maps blur.</text>

  <!-- F4 -->
  <circle cx="96" cy="460" r="15" fill="#C27B58"/>
  <text x="96" y="465" text-anchor="middle" class="feat-n">★</text>
  <text x="128" y="456" class="feat-t">The AI interview — the unlock</text>
  <text x="128" y="478" class="feat-d">A methodology-trained agent runs the structured conversation</text>
  <text x="128" y="496" class="feat-d">and writes the model live. The decades-old bottleneck, broken.</text>

  <!-- Divider between text and schematic -->
  <line x1="940" y1="190" x2="940" y2="514" stroke="#ECE4D0" stroke-width="1.5"/>

  <!-- Right: schematic -->
  <text x="980" y="196" class="sch-cap">ONE ACTIVITY, FULLY MODELED</text>

  <!-- Decomposition tree -->
  <rect x="1192" y="206" width="120" height="32" rx="4" fill="#3B4B35"/>
  <text x="1252" y="227" text-anchor="middle" class="node">A0</text>
  <line x1="1252" y1="238" x2="1252" y2="250" stroke="#3B4B35" stroke-width="1.5"/>
  <line x1="1052" y1="250" x2="1452" y2="250" stroke="#3B4B35" stroke-width="1.5"/>
  <line x1="1052" y1="250" x2="1052" y2="264" stroke="#3B4B35" stroke-width="1.5"/>
  <line x1="1252" y1="250" x2="1252" y2="264" stroke="#3B4B35" stroke-width="1.5"/>
  <line x1="1452" y1="250" x2="1452" y2="264" stroke="#3B4B35" stroke-width="1.5"/>
  <rect x="1002" y="264" width="100" height="30" rx="4" fill="#FFFFFF" stroke="#3B4B35" stroke-width="1.5"/>
  <text x="1052" y="284" text-anchor="middle" class="icom-l">A1</text>
  <rect x="1202" y="264" width="100" height="30" rx="4" fill="#FFFFFF" stroke="#3B4B35" stroke-width="1.5"/>
  <text x="1252" y="284" text-anchor="middle" class="icom-l">A2</text>
  <rect x="1402" y="264" width="100" height="30" rx="4" fill="#FFFFFF" stroke="#3B4B35" stroke-width="1.5"/>
  <text x="1452" y="284" text-anchor="middle" class="icom-l">A3</text>

  <!-- SIPOC strip -->
  <text x="980" y="320" class="sch-cap">SIPOC — WHO &amp; WHAT</text>
  <g>
    <rect x="980"  y="328" width="104" height="44" fill="#BFA36F"/>
    <text x="1032" y="350" text-anchor="middle" class="sipoc-l">SUPPLIER</text>
    <text x="1032" y="365" text-anchor="middle" class="sipoc-w">(person)</text>
    <rect x="1090" y="328" width="104" height="44" fill="#9FB08A"/>
    <text x="1142" y="350" text-anchor="middle" class="sipoc-l">INPUT</text>
    <text x="1142" y="365" text-anchor="middle" class="sipoc-w">(consumed)</text>
    <rect x="1200" y="328" width="104" height="44" fill="#3B4B35"/>
    <text x="1252" y="350" text-anchor="middle" class="sipoc-l">PROCESS</text>
    <text x="1252" y="365" text-anchor="middle" style="font-size:10.5px;fill:#E7DEC6;">(activity)</text>
    <rect x="1310" y="328" width="104" height="44" fill="#9FB08A"/>
    <text x="1362" y="350" text-anchor="middle" class="sipoc-l">OUTPUT</text>
    <text x="1362" y="365" text-anchor="middle" class="sipoc-w">(produced)</text>
    <rect x="1420" y="328" width="104" height="44" fill="#BFA36F"/>
    <text x="1472" y="350" text-anchor="middle" class="sipoc-l">CUSTOMER</text>
    <text x="1472" y="365" text-anchor="middle" class="sipoc-w">(person)</text>
  </g>

  <!-- ICOM glyph -->
  <text x="980" y="396" class="sch-cap">ICOM — HOW IT FLOWS</text>
  <text x="1252" y="406" text-anchor="middle" style="font-size:11px;font-weight:700;fill:#C27B58;">Control</text>
  <line x1="1252" y1="410" x2="1252" y2="428" stroke="#C27B58" stroke-width="1.8" marker-end="url(#arrclay)"/>
  <rect x="1192" y="430" width="120" height="46" rx="4" fill="#FFFFFF" stroke="#3B4B35" stroke-width="2"/>
  <text x="1252" y="458" text-anchor="middle" class="icom-l">ACTIVITY</text>
  <!-- Input (left, in) -->
  <line x1="1102" y1="453" x2="1190" y2="453" stroke="#3B4B35" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="1100" y="449" text-anchor="end" class="icom-l">Input</text>
  <!-- Output (right, out) -->
  <line x1="1314" y1="453" x2="1402" y2="453" stroke="#3B4B35" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="1406" y="449" text-anchor="start" class="icom-l">Output</text>
  <!-- Mechanism (bottom, in) -->
  <line x1="1252" y1="500" x2="1252" y2="478" stroke="#6B6A63" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="1252" y="514" text-anchor="middle" style="font-size:11px;font-weight:700;fill:#6B6A63;">Mechanism — tools &amp; systems</text>

  <!-- ═══════════ LOWER BAND — WHERE THIS CAME FROM ═══════════ -->
  <rect x="60" y="556" width="1480" height="40" fill="#C27B58"/>
  <text x="80" y="581"><tspan class="band-cap">WHERE THIS CAME FROM</tspan><tspan class="band-cap" style="font-weight:400;">   —  I BUILT THIS DISCIPLINE BY HAND, AT FORTUNE-20 SCALE</tspan></text>

  <!-- Three proof cards -->
  <!-- PC1 -->
  <rect x="60"  y="608" width="476" height="220" fill="#FFFFFF" stroke="#D9CFB8" stroke-width="1"/>
  <rect x="60"  y="608" width="5"   height="220" fill="#C27B58"/>
  <text x="86"  y="638" class="micro">THE QUALITY-SYSTEM ORIGIN</text>
  <text x="86"  y="666" class="pc-skill">Decomposed a 24×7 operation by hand</text>
  <text x="86"  y="700" class="pc-v">86% fewer errors · 50 → 1 attrition</text>
  <text x="86"  y="726" class="pc-l">Walked technicians through every job to diagram the</text>
  <text x="86"  y="744" class="pc-l">flows, then wrote 143 SOPs — an ISO 9000 quality</text>
  <text x="86"  y="762" class="pc-l">system that cut outages 80%.</text>
  <text x="86"  y="800" class="pc-anchor">“An 86% decrease in procedural errors… attrition 50%</text>
  <text x="86"  y="817" class="pc-anchor">to 1%.” — Ellen Behrle, Acting Director, VZ</text>

  <!-- PC2 -->
  <rect x="562" y="608" width="476" height="220" fill="#FFFFFF" stroke="#D9CFB8" stroke-width="1"/>
  <rect x="562" y="608" width="5"   height="220" fill="#C27B58"/>
  <text x="588" y="638" class="micro">THE FORENSIC DECOMPOSITION</text>
  <text x="588" y="666" class="pc-skill">Mapped a process down to the atom</text>
  <text x="588" y="700" class="pc-v">400+ activities · 110 handoffs</text>
  <text x="588" y="726" class="pc-l">Took an enterprise asset process apart — 64 systems,</text>
  <text x="588" y="744" class="pc-l">~200 waste drivers — then co-led the Work-Out that cut</text>
  <text x="588" y="762" class="pc-l">43% of critical-path steps and 33% of handoffs.</text>
  <text x="588" y="800" class="pc-anchor">Forensic decomposition that became the foundation</text>
  <text x="588" y="817" class="pc-anchor">for a $40M enterprise modernization blueprint.</text>

  <!-- PC3 -->
  <rect x="1064" y="608" width="476" height="220" fill="#FFFFFF" stroke="#D9CFB8" stroke-width="1"/>
  <rect x="1064" y="608" width="5"   height="220" fill="#C27B58"/>
  <text x="1090" y="638" class="micro">THE INTERVIEWER'S INSTINCT</text>
  <text x="1090" y="666" class="pc-skill">Knew the right questions to ask</text>
  <text x="1090" y="700" class="pc-v">The method, now teachable to AI</text>
  <text x="1090" y="726" class="pc-l">The structured interview I ran for 20+ years is exactly</text>
  <text x="1090" y="744" class="pc-l">what Forester's agent now conducts — the same questions,</text>
  <text x="1090" y="762" class="pc-l">the same rigor, without the consultant bottleneck.</text>
  <text x="1090" y="800" class="pc-anchor">“Jeff knows the right questions to ask… process maps</text>
  <text x="1090" y="817" class="pc-anchor">used for years.” — John Demetrio, Director, VZ</text>

  <!-- Footer ribbon -->
  <line x1="60" y1="852" x2="1540" y2="852" stroke="#D9CFB8" stroke-width="1.5"/>
  <text x="800" y="882" text-anchor="middle" class="footer">Capture is the root system. Everything Forester quantifies, visualizes, and decides stands on the structure laid down here — the discipline I spent a career proving by hand.</text>

</svg>
