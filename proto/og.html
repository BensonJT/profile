<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<title>OG card</title>
<link rel="stylesheet" href="../css/site.css">
<style>
  body { margin:0; background:#555; }
  .og { width:1200px; height:630px; background:var(--ink); color:var(--vellum);
        padding:76px 84px; display:flex; flex-direction:column; justify-content:space-between;
        position:relative; overflow:hidden; }
  .og__name { font-size:15px; font-weight:600; letter-spacing:.2em; text-transform:uppercase;
              color:var(--gold-ink); }
  .og h1 { font-family:var(--font-display); font-size:82px; line-height:1.0;
           letter-spacing:-.02em; max-width:16ch; margin:26px 0 0; }
  .og__sub { font-size:22px; line-height:1.5; color:var(--n-300); max-width:44ch; margin-top:22px; }
  .og__bar { display:flex; gap:52px; border-top:1px solid rgba(240,234,214,.18); padding-top:26px; }
  .og__m b { display:block; font-size:32px; font-weight:600; color:var(--gold-ink);
             font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
  .og__m span { font-size:14px; color:var(--n-300); }
  .og__url { position:absolute; right:84px; bottom:76px; font-size:15px; color:var(--n-300); }
</style></head><body>
<div class="og">
  <div>
    <p class="og__name">Jeffrey Benson</p>
    <h1>I go into the problems nobody owns.</h1>
    <p class="og__sub">Eight domains in thirty-one years. Every one unfamiliar on day one, every one measurably better on the way out.</p>
  </div>
  <div class="og__bar">
    <div class="og__m"><b>$40M</b><span>Expense reduction</span></div>
    <div class="og__m"><b>15 &rarr; 500</b><span>Servers per week</span></div>
    <div class="og__m"><b>50% &rarr; 1%</b><span>Attrition</span></div>
    <div class="og__m"><b>$18&ndash;22M</b><span>Hidden capacity</span></div>
  </div>
  <p class="og__url">bensonjt.github.io/profile</p>
</div>
</body></html>
